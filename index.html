<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="A private, memory-first travel atlas. Places, schematic routes, and honest dates."
    />
    <title>Trip Atlas · 旅行图册</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./vendor/maplibre-gl.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Trip Atlas</span>
        <span class="brand-zh">旅行图册</span>
      </div>
      <div class="view-toggle" role="group" aria-label="Map view">
        <button class="view-btn active" type="button" data-view="routes" aria-pressed="true">
          Routes <span>路线</span>
        </button>
        <button class="view-btn" type="button" data-view="timeline" aria-pressed="false">
          Timeline <span>时间线</span>
        </button>
        <button class="view-btn" type="button" data-view="visited" aria-pressed="false">
          Visited <span>足迹</span>
        </button>
      </div>
      <div id="stats" class="stats" aria-live="polite"></div>
      <button id="panel-toggle" class="panel-toggle" type="button" aria-expanded="false">
        List <span>列表</span>
      </button>
    </header>

    <main class="app">
      <aside id="sidebar" class="sidebar" aria-label="Places and filters">
        <div class="sidebar-head">
          <div>
            <h1 id="list-title">Places <span>地点</span></h1>
            <p id="result-count" class="result-count"></p>
          </div>
          <button id="clear-filters" class="ghost" type="button">Clear</button>
        </div>

        <div class="filters">
          <label class="search">
            <span class="sr-only">Search places</span>
            <input id="search" type="search" placeholder="Search 搜索…" autocomplete="off" />
          </label>
          <div class="filter-row">
            <label>
              <span class="sr-only">Year</span>
              <select id="filter-year"></select>
            </label>
            <label>
              <span class="sr-only">Country</span>
              <select id="filter-country"></select>
            </label>
          </div>
          <label>
            <span class="sr-only">Trip</span>
            <select id="filter-trip"></select>
          </label>
          <label>
            <span class="sr-only">Purpose</span>
            <select id="filter-tag"></select>
          </label>
        </div>

        <div id="list" class="list" aria-live="polite"></div>
      </aside>

      <div id="map" class="map" aria-label="Travel map"></div>

      <aside id="detail" class="detail hidden" aria-label="Details" aria-live="polite">
        <button id="detail-close" class="detail-close" type="button" aria-label="Close details">×</button>
        <div id="detail-content"></div>
      </aside>
    </main>

    <div id="region-legend" class="region-legend hidden" aria-label="Visited map legend">
      <span><i class="swatch visited"></i>Visited</span>
      <span><i class="swatch unvisited"></i>Not visited</span>
      <small>Boundaries: Natural Earth</small>
    </div>

    <div id="backdrop" class="backdrop" hidden></div>

    <div id="map-error" class="map-error hidden" role="status">
      <strong>Map unavailable.</strong>
      <span>The place list still works. WebGL or the map style could not load.</span>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
